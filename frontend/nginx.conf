# SPA serving config for the production frontend image.
# - client-side routes (/auth/callback, /bridge, ...) fall back to index.html
# - /api is proxied to the backend service (override BACKEND_ORIGIN via envsubst or an
#   infrastructure-level route if the API is exposed elsewhere)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # security headers (the app is a same-origin SPA with bearer tokens)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # hashed build assets can cache forever; index.html must not
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API proxy — keeps the app same-origin (no CORS surface at all)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # bridge WebSocket relay
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        client_max_body_size 26m;  # matches TM_MAX_UPLOAD_BYTES
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
